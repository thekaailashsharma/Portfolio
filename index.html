    <style>
      :root, .dark {
        --surface-0: #1A1510;
        --surface-1: #26201A;
        --surface-2: #332B20;
        --surface-3: #453A2B;
        --surface-4: #5A4A36;
        --accent: #E0683A;
        --accent-dim: #C8502A;
        --accent-bright: #F08A5A;
        --note: #8A8175;
        --text-primary: #F2ECDD;
        --text-secondary: #C3B8A6;
        --text-muted: #8A8175;
        --grain-opacity: 0.03;
        --grid-opacity: 0.04;
        color-scheme: dark;
      }
      .light {
        --surface-0: #f5f1e6;
        --surface-1: #efe9da;
        --surface-2: #e4ddc9;
        --surface-3: #cfc7b2;
        --surface-4: #b6ac93;
        --accent: #c2410c;          /* vivid terracotta — visible & warm on beige */
        --accent-dim: #9a3412;
        --accent-bright: #ea580c;
        --note: #6b5d4c;
        --text-primary: #1a1410;
        --text-secondary: #3d342a;
        --text-muted: #6b5d4c;
        --grain-opacity: 0.02;
        --grid-opacity: 0.05;
        color-scheme: light;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; background: var(--surface-0); scrollbar-width: thin; scrollbar-color: var(--surface-4) var(--surface-0); }
      body { background: var(--surface-0); color: var(--text-primary); font-family: 'Space Grotesk', system-ui, sans-serif; overflow-x: hidden; transition: background 0.4s ease, color 0.4s ease; }
      ::selection { background: rgba(200, 168, 124, 0.25); color: var(--accent-bright); }
      .light ::selection { background: rgba(139, 111, 71, 0.2); color: #1c1917; }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: var(--surface-0); }
      ::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--surface-3); }

      @keyframes grain {
        0%, 100% { transform: translate(0,0) }
        10% { transform: translate(-5%,-10%) }
        20% { transform: translate(-15%,5%) }
        30% { transform: translate(7%,-25%) }
        40% { transform: translate(-5%,25%) }
        50% { transform: translate(-15%,10%) }
        60% { transform: translate(15%,0%) }
        70% { transform: translate(0%,15%) }
        80% { transform: translate(3%,35%) }
        90% { transform: translate(-10%,10%) }
      }
      .grain-overlay::after {
        content: '';
        position: fixed;
        top: -50%; left: -50%;
        width: 200%; height: 200%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        animation: grain 8s steps(10) infinite;
        pointer-events: none;
        z-index: 9999;
        opacity: var(--grain-opacity);
      }

      nav, section, div, aside, article, a, span, p, h1, h2, h3, h4 {
        transition: background-color 0.35s ease, border-color 0.35s ease, color 0.35s ease;
      }

      @keyframes breathe {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      .animate-breathe { animation: breathe 3s ease-in-out infinite; }
      .animate-float { animation: float 4s ease-in-out infinite; }

      /* Splash screen */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        transition: opacity 0.5s ease;
      }
      .light #splash { background: #f7f4eb; }
      .dark #splash { background: #09090b; }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      #splash-monogram {
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 48px;
        margin-bottom: 24px;
        opacity: 0;
        animation: splashFadeIn 0.6s ease 0.1s forwards;
      }
      .light #splash-monogram { color: #8b6f47; }
      .dark #splash-monogram { color: #c8a87c; }
      #splash-fact {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 13px;
        max-width: 280px;
        line-height: 1.7;
        opacity: 0;
        animation: splashFadeIn 0.6s ease 0.4s forwards;
      }
      .light #splash-fact { color: #78716c; }
      .dark #splash-fact { color: #71717a; }
      #splash-bar {
        position: absolute;
        bottom: 40px;
        width: 60px;
        height: 2px;
        border-radius: 1px;
        overflow: hidden;
      }
      .light #splash-bar { background: #d4d0c4; }
      .dark #splash-bar { background: #27272a; }
      #splash-bar-fill {
        height: 100%;
        border-radius: 1px;
        animation: splashProgress 1.5s ease forwards;
      }
      .light #splash-bar-fill { background: #8b6f47; }
      .dark #splash-bar-fill { background: #c8a87c; }
      @keyframes splashFadeIn { to { opacity: 1; } }
      @keyframes splashProgress { from { width: 0; } to { width: 100%; } }

      /* ============================================================
         VISIBILITY + GLASS + COLOR pass — layout untouched, beige kept
         ============================================================ */

      /* 1) MORE COLOR — gentle multi-hue washes over the beige, fixed,
            sitting behind all content (gives glass something to refract) */
      .light .bg-surface-0 {
        background-image:
          radial-gradient(48vw 38vw at -5% -5%,  rgba(234,88,12,.12),  transparent 55%),
          radial-gradient(44vw 40vw at 105% 18%, rgba(13,148,136,.10), transparent 55%),
          radial-gradient(46vw 42vw at 50% 108%, rgba(139,92,246,.09), transparent 60%),
          radial-gradient(40vw 36vw at 20% 60%,  rgba(217,119,6,.07),  transparent 58%);
        background-attachment: fixed;
      }
      .dark .bg-surface-0 {
        background-image:
          radial-gradient(48vw 38vw at -5% -5%,  rgba(234,88,12,.10),  transparent 55%),
          radial-gradient(44vw 40vw at 105% 18%, rgba(45,212,191,.07), transparent 55%),
          radial-gradient(46vw 42vw at 50% 108%, rgba(139,92,246,.08), transparent 60%);
        background-attachment: fixed;
      }

      /* 2) REAL GLASS — every translucent surface card becomes frosted glass */
      [class*="bg-surface-1/"],
      [class*="bg-surface-2/"],
      [class*="bg-surface-3/"] {
        -webkit-backdrop-filter: blur(12px) saturate(155%);
                backdrop-filter: blur(12px) saturate(155%);
      }
      /* glossy top edge so glass reads as glass */
      .light [class*="rounded-"][class*="bg-surface-1/"],
      .light [class*="rounded-"][class*="bg-surface-2/"] {
        box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 8px 24px -12px rgba(60,40,20,.18);
      }
      .dark [class*="rounded-"][class*="bg-surface-1/"],
      .dark [class*="rounded-"][class*="bg-surface-2/"] {
        box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 12px 30px -14px rgba(0,0,0,.5);
      }

      /* 3) MORE VISIBLE — lift the low-contrast body text in light/beige mode */
      .light .text-stone-300 { color: #8c8073 !important; }
      .light .text-stone-400 { color: #6b5d4c !important; }
      .light .text-stone-500 { color: #534739 !important; }
      .light .text-stone-600 { color: #3d342a !important; }
      /* dark mode: warm up + lift faded zinc grays so text isn't lost on the charcoal */
      .dark .text-zinc-700 { color: #9a8f7d !important; }
      .dark .text-zinc-600 { color: #ab9f8b !important; }
      .dark .text-zinc-500 { color: #c2b7a3 !important; }
      .dark .text-zinc-400 { color: #d8ceba !important; }
      /* stronger card definition so edges are visible on beige */
      .light [class*="border-surface-3/"],
      .light [class*="border-surface-4/"] { border-color: rgba(120,95,60,.28) !important; }
      /* the accent works harder: brighter selection + bolder accent text */
      .light .text-accent\/40 { color: rgba(194,65,12,.7) !important; }
      .light .text-accent\/50 { color: rgba(194,65,12,.8) !important; }

      /* ===== Liquid-glass panel utilities (modals, overlays, big surfaces) ===== */
      /* LIQUID GLASS (Aave method): transparent + refractive (SVG displacement) + specular edges */
      .glass-panel {
        background: rgba(247,243,233,0.86);
        -webkit-backdrop-filter: blur(30px) saturate(140%);
                backdrop-filter: blur(30px) saturate(140%);
        border: 1px solid rgba(255,255,255,.6);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.95),     /* top rim light */
          inset 1px 0 0 rgba(255,255,255,.35),      /* left specular */
          inset -1px 0 0 rgba(255,255,255,.35),     /* right specular */
          inset 0 -1px 2px rgba(255,255,255,.25),
          0 30px 70px -25px rgba(33,27,22,.5);
      }
      .dark .glass-panel {
        background: rgba(28,23,17,0.9);
        border-color: rgba(255,255,255,.16);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.22),
          inset 1px 0 0 rgba(255,255,255,.08),
          inset -1px 0 0 rgba(255,255,255,.08),
          0 30px 70px -25px rgba(0,0,0,.7);
      }
      /* @supports fallback: browsers without SVG-backdrop still get frosted glass */
      @supports not (backdrop-filter: url(#liquid-panel)) {
        .glass-panel { -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%); }
      }
      /* slow rim-light sweep for headers / primary CTAs */
      .glass-sheen { position: relative; overflow: hidden; }
      .glass-sheen::after {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.35) 48%, transparent 62%);
        transform: translateX(-130%); animation: sheen 7s ease-in-out infinite;
      }
      @keyframes sheen { 0%,70%,100% { transform: translateX(-130%); } 82% { transform: translateX(130%); } }
      .media-duotone { filter: contrast(1.06) saturate(1.02); }

      @media (prefers-reduced-motion: reduce) {
        .grain-overlay::after { animation: none; }
        .glass-sheen::after { animation: none; opacity: 0; }
        *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
      }
    </style>
